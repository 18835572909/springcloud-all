server:
  port: 10000

spring:
  application:
    name: gateway-server # 服务名
  cloud:
    sentinel:
      enabled: true
      eager: true
      scg:
        order: -10000
      transport:
        port: 11000
        dashboard: localhost:8080
        heartbeat-interval-ms: 100
      filter:
        enabled: false
      datasource:
        ds1:
          nacos:
            username: nacos
            password: nacos
            server-addr: localhost:8848
            namespace: 1545d8fb-aaa6-43c7-bdf9-1db0ae11d8b4
            dataId: gw-flow.json
            groupId: DEFAULT_GROUP
            data-type: json
            rule-type: gw-flow
    gateway:
      routes: # 路由配置
        - id: order-service # 路由 ID（唯一）
#          uri: http://localhost:8081 # 目标服务地址（可替换为 lb://service-name 实现负载均衡）
          uri: lb://service-order
          predicates: # 路由断言（匹配请求条件）
            - Path=/order/** # 匹配以 /api/ 开头的路径
          filters: # 路由过滤器（请求/响应处理）
            - StripPrefix=0   # 去除路径前缀数量（如 /api/user → /user）
            - AddRequestHeader=X-From-Gateway, true # 添加请求头

        - id: wms-service # 路由 ID（唯一）
            #uri: http://localhost:8081 # 目标服务地址（可替换为 lb://service-name 实现负载均衡）
          uri: lb://service-wms
          predicates: # 路由断言（匹配请求条件）
            - Path=/wms/** # 匹配以 /api/ 开头的路径
          filters: # 路由过滤器（请求/响应处理）
            - StripPrefix=0   # 去除路径前缀数量（如 /api/user → /user）
            - AddRequestHeader=X-From-Gateway, true # 添加请求头

